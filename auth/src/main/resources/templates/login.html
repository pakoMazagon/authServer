<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Tutorial</title>

    <!-- Bootstrap -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link href="https://getbootstrap.com/docs/4.0/examples/signin/signin.css" rel="stylesheet" crossorigin="anonymous"/>

    <!-- jQuery & jQuery UI (required for positioning) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link href="https://code.jquery.com/ui/1.13.2/themes/smoothness/jquery-ui.css" rel="stylesheet"/>

    <!-- Keyboard plugin -->
    <link href="https://cdn.jsdelivr.net/npm/virtual-keyboard@1.30.0/dist/css/keyboard.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/virtual-keyboard@1.30.0/dist/js/jquery.keyboard.min.js"></script>

    <style>
        html, body {
            min-height: 100vh;
            overflow-y: auto; /* permitir scroll vertical */
        }
        
        .container {
            overflow: visible; /* el contenedor no oculta contenido */
        }
        .custom-keyboard {
            z-index: 9999 !important;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 12px;
            padding: 15px 12px;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.15);
            width: auto;
            margin: 0 auto;
            text-align: center;
        }

        .custom-keyboard button {
            margin: 6px 5px;
            border-radius: 10px;
            border: 1.5px solid #007bff;
            background-color: white;
            color: #007bff;
            font-weight: 600;
            font-size: 1.05em;
            box-shadow: 0 4px 8px rgba(0,123,255,0.1);
            cursor: pointer;
            height: 44px;
            line-height: 44px;
            padding: 0 16px;
            transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
            text-align: center;
            user-select: none;
        }

        .custom-keyboard button:hover,
        .custom-keyboard button:focus {
            background-color: #007bff;
            color: white;
            box-shadow: 0 6px 20px rgba(0,123,255,0.4);
            outline: none;
        }

        #keyboard-anchor {
            position: relative;
             margin-bottom: 180px; 
        }
    </style>
</head>
<body>
<div class="container">
    <form class="form-signin" method="post" th:action="@{/login}">
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Credenciales erróneas
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Has cerrado sesión.
        </div>
        <h2 class="form-signin-heading">Sign In</h2>

        <p>
            <label for="username" class="sr-only">Nombre de Usuario</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>
        </p>
        <p>
            <label for="password" class="sr-only">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </p>

        <button class="btn btn-lg btn-primary btn-block" type="submit">Iniciar Sesión</button>

        <!-- Botón de Google con ID de ancla -->
        <div id="keyboard-anchor" class="text-center mt-3">
            <a class="btn btn-light bg-white" href="/oauth2/authorization/google-idp" role="link" style="text-transform: none;">
                <img src="https://developers.google.com/identity/images/g-logo.png" width="20" style="margin-right: 5px;" alt="Sign in with Google"/>
                Sign in with Google
            </a>
        </div>
    </form>
</div>

<script>
    function isMobileDevice() {
        return /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
    }

    $(function () {
        if (!isMobileDevice()) {
            const keyboardOptions = {
                layout: 'qwerty',
                usePreview: false,
                autoAccept: true,
                alwaysOpen: false,
                stayOpen: false,
                position: {
                    of: window,
                    my: 'top center',
                    at: 'bottom center',
                    collision: 'fit flip',
                    offset: "0 -10"   // mueve 10px hacia abajo el teclado
                },
                css: {
                    container: 'custom-keyboard'
                }
            };
            $('#username').keyboard(keyboardOptions);
            $('#password').keyboard(keyboardOptions);
        }
    });
</script>
</body>
</html>
